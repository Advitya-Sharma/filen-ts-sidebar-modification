name: Build Android APK (fast scroll fork)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packages/filen-mobile/**', '.github/workflows/build-android-fast-scroll.yml']

concurrency:
  group: build-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    defaults:
      run:
        working-directory: packages/filen-mobile
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Encryption key
        env:
          SECRET_KEY: ${{ secrets.SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY }}
        run: |
          KEY="${SECRET_KEY:-$(openssl rand -hex 32)}"
          echo "::add-mask::$KEY"
          echo "EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY=$KEY" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SECURE_STORE_UNSECURE_FALLBACK_ENCRYPTION_KEY=$KEY" > .env

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-02-20
          components: rust-src
          targets: aarch64-linux-android
      - uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-ndk@4.1.2

      - name: Install
        run: |
          brew install meson ninja nasm
          pnpm install --frozen-lockfile --filter @filen/mobile...

      - name: Build APK
        env:
          NODE_ENV: production
          APP_ENV: production
        run: |
          pnpm run prebuild:ci:android
          cd android && chmod +x gradlew
          ./gradlew app:assembleRelease -PreactNativeArchitectures=arm64-v8a

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk "$RUNNER_TEMP/Filen-android-fast-scroll.apk"
          gh release delete fast-scroll-latest --cleanup-tag --yes || true
          gh release create fast-scroll-latest "$RUNNER_TEMP/Filen-android-fast-scroll.apk" \
            --prerelease --target "$GITHUB_SHA" --title "Filen Android - fast scroll build" \
            --notes "Tap Filen-android-fast-scroll.apk to install."
